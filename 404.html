<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <!-- Update the hashes when editing the inline styles or script. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-oz/ecYsbi2edeinx5dI0hZbT6FdHa5dHlYoyuYZoPj8='; style-src 'self' 'sha256-mLcsMqOWlbcfPA8XViQjn9/xKY8312mywMHl21Ur7I0='; font-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; require-trusted-types-for 'script'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F9F7F2">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>404 — Страница не найдена · Полина Киселёва</title>
  <style>
    body.not-found {
      margin: 0;
      background-color: #F9F7F2;
      color: #38383A;
      font-family: var(--sans, "Segoe UI", sans-serif);
      line-height: 1.55;
    }

    .missing-shell {
      display: grid;
      grid-template-rows: auto 1fr;
      width: min(73rem, calc(100% - 2 * clamp(1rem, 5vw, 4rem)));
      min-height: 100vh;
      min-height: 100svh;
      margin-inline: auto;
    }

    .missing-header {
      display: flex;
      min-height: 4.5rem;
      align-items: center;
      border-bottom: 1px solid #DDD6C7;
    }

    .missing-brand {
      display: inline-flex;
      align-items: center;
      gap: .65rem;
      min-height: 2.75rem;
      color: inherit;
      font-weight: 500;
      text-decoration: none;
    }

    .missing-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, .92fr);
      gap: clamp(1rem, 6vw, 5rem);
      align-items: center;
      padding-block: clamp(2.5rem, 7vw, 5.5rem);
    }

    .missing-copy {
      position: relative;
      z-index: 1;
    }

    .missing-title, .missing-number {
      margin: 0;
      font-family: var(--handwriting, "Segoe Print", Georgia, serif);
      font-style: italic;
      font-weight: 700;
      line-height: 1;
    }

    .missing-title {
      max-width: 13ch;
      font-size: clamp(2.5rem, 5.9vw, 5.25rem);
    }

    .missing-copy p {
      max-width: 32ch;
      margin: 1.1rem 0 1.65rem;
      color: #5E5D66;
    }

    .missing-action {
      box-sizing: border-box;
      display: inline-flex;
      align-items: center;
      gap: .65rem;
      min-height: 3rem;
      padding: .5rem 1.125rem;
      border: 1px solid #A57E32;
      border-radius: 999px;
      background-color: #FAF3E2;
      color: #38383A;
      font-weight: 600;
      text-decoration: none;
    }

    .missing-action:hover {
      background-color: #F3E8CD;
    }

    .not-found a:focus-visible {
      outline: 2px solid #70551F;
      outline-offset: 4px;
    }

    .missing-figure {
      position: relative;
      isolation: isolate;
      display: grid;
      place-items: center;
      aspect-ratio: 1.13;
      margin: 0;
    }

    .missing-figure[data-painted]::before,
    .missing-figure[data-painted]::after {
      position: absolute;
      z-index: -1;
      inset: 2% 0 12%;
      background: #AEBEAD var(--wash) center / 100% 100% no-repeat;
      background-blend-mode: luminosity;
      -webkit-mask: var(--wash) center / 100% 100% no-repeat;
      mask: var(--wash) center / 100% 100% no-repeat;
      opacity: .69;
      transform: rotate(-9deg);
      content: "";
    }

    .missing-figure[data-painted]::after {
      inset: 46% 0 2% 27%;
      background-color: #DBA890;
      opacity: .57;
      transform: rotate(13deg);
    }

    .missing-number {
      margin-top: -.08em;
      color: #536056;
      font-size: clamp(6.5rem, 13vw, 12rem);
      letter-spacing: -.035em;
    }

    .missing-thread {
      position: absolute;
      inset: 15% -1% auto;
      width: 102%;
      height: auto;
      pointer-events: none;
    }

    @media (max-width: 42rem) {
      .missing-layout {
        grid-template-columns: minmax(0, 1fr);
        align-content: center;
        gap: 1rem;
        padding-block: 2.5rem 1.25rem;
      }

      .missing-figure {
        width: min(100%, 22rem);
        justify-self: center;
      }
    }
  </style>
</head>
<body class="not-found">
  <div class="missing-shell">
    <header class="missing-header">
      <a class="missing-brand" href="/" data-home aria-label="Полина Киселёва, на главную">
        <svg width="34" height="34" viewBox="0 0 42 42" fill="none" aria-hidden="true" focusable="false">
          <path d="M32 11c-6-8-20-7-24 3-5 10 3 22 14 19 10-3 14-15 8-22-6-7-18-5-20 3-2 9 5 16 13 13 7-2 9-11 4-15-5-5-12-2-12 4 0 5 4 8 8 6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
        </svg>
        Полина Киселёва
      </a>
    </header>
    <main class="missing-layout">
      <div class="missing-copy">
        <h1 class="missing-title">Страница не найдена</h1>
        <p>Возможно, ссылка устарела или в адресе опечатка.</p>
        <a class="missing-action" href="/" data-home><span aria-hidden="true">←</span> На главную</a>
      </div>
      <figure class="missing-figure" aria-hidden="true">
        <span class="missing-number">404</span>
        <svg class="missing-thread" width="498" height="266" viewBox="0 0 498 266" fill="none" focusable="false">
          <defs>
            <linearGradient id="gold-thread" x1="6" y1="215" x2="493" y2="40" gradientUnits="userSpaceOnUse">
              <stop stop-color="#AE8424"/>
              <stop offset=".45" stop-color="#D4AF55"/>
              <stop offset="1" stop-color="#956814"/>
            </linearGradient>
          </defs>
          <path d="M6 220C69 232 95 212 151 218c49 5 79 23 123 21 38-2 70-20 93-41 35-31 47-68 40-96-6-24-27-39-44-33-17 6-17 26-7 36 15 16 45 7 67-9 23-16 48-40 70-49" stroke="url(#gold-thread)" stroke-width="1.35" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
          <path d="M25 224c46 4 73-10 117-4m251-142c-9-8-21-9-28-5" stroke="#D4AF55" stroke-width=".75" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
        </svg>
      </figure>
    </main>
  </div>
  <script>
    const siteRoot = location.hostname === "andeki444.github.io"
      ? "/psychologists-business-card-site/"
      : "/";

    for (const link of document.querySelectorAll("[data-home]")) {
      link.href = siteRoot;
    }

    const stylesheet = document.createElement("link");
    stylesheet.rel = "stylesheet";
    stylesheet.href = siteRoot + "assets/site.css?v=release";
    document.head.append(stylesheet);

    const favicon = document.createElement("link");
    favicon.rel = "icon";
    favicon.type = "image/svg+xml";
    favicon.href = siteRoot + "assets/favicon.svg?v=spiral";
    document.head.append(favicon);

    const figure = document.querySelector(".missing-figure");
    figure.style.setProperty("--wash", 'url("' + siteRoot + 'assets/acrylic-wash.webp")');
    figure.dataset.painted = "";
  </script>
</body>
</html>
